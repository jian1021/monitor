name: Market RSI Monitor

on:
  schedule:
    # 每 15 分钟运行一次
    # - cron: '*/15 * * * *'
    - cron: '0 * * * *'
  workflow_dispatch: # 允许网页端手动点击按钮测试

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          # lp_apr 模块需要 robinhood-chain-lp-tools 子模块（GitHub runner 自带 node）
          submodules: true

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行监控脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_TOKEN: ${{ secrets.LIBSQL_TOKEN }} 
          # CI 是一次性进程，不起常驻 rhpools 服务（lp_apr 照常：子模块 + runner 自举 npm）
          RHP_AUTO_START: '0'
        run: python main.py
