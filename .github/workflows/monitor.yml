name: Market RSI Monitor

on:
  schedule:
    # 每 15 分钟运行一次
    # - cron: '*/15 * * * *'
    - cron: '0 * * * *'
  workflow_dispatch: # 允许网页端手动点击按钮测试

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行监控脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py
